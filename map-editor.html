<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Éditeur de Maps — Oris</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111827;
  color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* ── Toolbar ──────────────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 0;
  background: #0f172a;
  border-bottom: 2px solid #1e2d45;
  flex-shrink: 0;
  flex-wrap: wrap;
  min-height: 46px;
}
.tg {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-right: 1px solid #1e2d45;
}
.tg:last-child { border-right: none; }
.tg label { font-size: 11px; color: #6b7280; white-space: nowrap; }
.tg input[type="text"]   { width: 110px; }
.tg input[type="number"] { width: 50px; }
.tg input[type="text"], .tg input[type="number"] {
  background: #1e293b; border: 1px solid #334155;
  color: #e2e8f0; padding: 4px 7px;
  border-radius: 5px; font-size: 12px;
}
button {
  padding: 5px 11px; border-radius: 5px;
  border: 1px solid #334155; cursor: pointer;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  transition: filter .12s;
}
button:hover { filter: brightness(1.18); }
button.active { outline: 2px solid #38bdf8; outline-offset: 1px; }

#btn-load-tiles  { background: #1d4ed8; color: #fff; border-color: #2563eb; }
#btn-load-decos  { background: #0f766e; color: #fff; border-color: #0d9488; }
#btn-export      { background: #15803d; color: #fff; border-color: #16a34a; }
#btn-clear       { background: #7f1d1d; color: #fff; border-color: #991b1b; }
#btn-fill        { background: #7c3aed; color: #fff; border-color: #8b5cf6; }
#btn-eraser      { background: #1e293b; color: #e2e8f0; }
#btn-eraser.active { background: #d97706; color: #000; border-color: #f59e0b; }
#btn-resize      { background: #374151; color: #e2e8f0; }

/* Rotation buttons */
.rot-btn {
  background: #1e293b; color: #94a3b8;
  border: 1px solid #334155;
  padding: 4px 9px; font-size: 13px;
}
.rot-btn.active {
  background: #0c2132; color: #38bdf8;
  border-color: #38bdf8;
}

/* ── Mode tabs ──────────────────────────────────────────────── */
.mode-bar {
  display: flex;
  gap: 4px;
  padding: 4px 6px 2px;
  flex-shrink: 0;
}
.mode-tab {
  flex: 1; text-align: center;
  padding: 5px 0; border-radius: 5px 5px 0 0;
  font-size: 11px; font-weight: 700;
  letter-spacing: .5px; cursor: pointer;
  background: #1e293b; color: #6b7280;
  border: 1px solid transparent;
  transition: all .12s;
}
.mode-tab.active {
  background: #0c2132; color: #38bdf8;
  border-color: #38bdf8;
}

/* ── Layout ─────────────────────────────────────────────────── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Palette ────────────────────────────────────────────────── */
#palette {
  width: 200px; flex-shrink: 0;
  background: #0f172a;
  border-right: 1px solid #1e2d45;
  display: flex; flex-direction: column;
  overflow: hidden;
}
#palette-list {
  flex: 1; overflow-y: auto;
  padding: 4px 5px; display: flex;
  flex-direction: column; gap: 3px;
}
#palette-count {
  font-size: 10px; color: #6b7280;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 4px 8px;
  border-bottom: 1px solid #1e2d45;
  flex-shrink: 0;
}
.palette-item {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 5px; border-radius: 6px;
  cursor: pointer; border: 2px solid transparent;
  background: #1e293b;
}
.palette-item:hover  { background: #243347; }
.palette-item.active { border-color: #38bdf8; background: #0c2132; }
.palette-thumb {
  width: 40px; height: 40px; object-fit: contain;
  border-radius: 4px; flex-shrink: 0;
  background: #2d3a4a;
}
.palette-label {
  font-size: 9px; color: #94a3b8;
  word-break: break-all; line-height: 1.35;
}

/* Rotation ring indicator on palette item */
.palette-item .rot-ring {
  font-size: 9px; color: #38bdf8;
  margin-top: 2px;
}

/* ── Exit palette ───────────────────────────────────────────── */
#exit-palette {
  flex: 1; overflow-y: auto; padding: 10px 8px;
  display: flex; flex-direction: column; gap: 10px;
}
.exit-field label {
  display: block; font-size: 10px; color: #6b7280;
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
}
.exit-field input {
  width: 100%; background: #1e293b; border: 1px solid #334155;
  color: #e2e8f0; padding: 5px 8px; border-radius: 5px; font-size: 12px;
}
.exit-field input:focus { outline: none; border-color: #38bdf8; }
.exit-hint {
  font-size: 10px; color: #4b5563; line-height: 1.5;
  padding: 6px 8px; background: #0b0f1a;
  border-radius: 6px; border: 1px solid #1e2738;
}
.exit-separator {
  border: none; border-top: 1px solid #1e2738; margin: 2px 0;
}
.exit-list-title {
  font-size: 10px; color: #6b7280; text-transform: uppercase;
  letter-spacing: 1px; font-weight: 700;
}
.exit-list-item {
  background: #0b0f1a; border: 1px solid #1e2738;
  border-radius: 6px; padding: 6px 8px;
  font-size: 10px; color: #94a3b8; line-height: 1.6;
  cursor: pointer; transition: border-color .12s;
}
.exit-list-item:hover { border-color: #f97316; }
.exit-list-item .exit-coords { color: #f97316; font-weight: 700; }
.exit-list-item .exit-target { color: #38bdf8; }
.exit-list-item .exit-remove {
  float: right; color: #ef4444; cursor: pointer;
  font-size: 12px; line-height: 1; margin-left: 6px;
}

/* ── NPC palette ────────────────────────────────────────────── */
#npc-palette {
  flex: 1; overflow-y: auto; padding: 10px 8px;
  display: flex; flex-direction: column; gap: 10px;
}
.npc-field label {
  display: block; font-size: 10px; color: #6b7280;
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
}
.npc-field input, .npc-field textarea {
  width: 100%; background: #1e293b; border: 1px solid #334155;
  color: #e2e8f0; padding: 5px 8px; border-radius: 5px; font-size: 11px;
  box-sizing: border-box; resize: vertical; font-family: inherit;
}
.npc-field input:focus, .npc-field textarea:focus { outline: none; border-color: #a78bfa; }
.npc-hint {
  font-size: 10px; color: #4b5563; line-height: 1.5;
  padding: 6px 8px; background: #0b0f1a;
  border-radius: 6px; border: 1px solid #1e2738;
}
.npc-list-title {
  font-size: 10px; color: #6b7280; text-transform: uppercase;
  letter-spacing: 1px; font-weight: 700;
}
.npc-list-item {
  background: #0b0f1a; border: 1px solid #1e2738;
  border-radius: 6px; padding: 6px 8px;
  font-size: 10px; color: #94a3b8; line-height: 1.6;
  cursor: pointer; transition: border-color .12s;
}
.npc-list-item:hover { border-color: #a78bfa; }
.npc-list-item .npc-coords { color: #a78bfa; font-weight: 700; }
.npc-list-item .npc-name   { color: #c4b5fd; }
.npc-list-item .npc-remove {
  float: right; color: #ef4444; cursor: pointer;
  font-size: 12px; line-height: 1; margin-left: 6px;
}

/* ── Canvas area ────────────────────────────────────────────── */
#canvas-wrap {
  flex: 1; overflow: auto;
  background: #1a2634;
  cursor: crosshair; position: relative;
}
#map-canvas { display: block; image-rendering: pixelated; }

#drop-hint {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(30,41,59,.72);
  font-size: 22px; font-weight: 700; color: #38bdf8; letter-spacing: 2px;
  pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 10;
}
#canvas-wrap.drag-over #drop-hint { opacity: 1; }

/* ── Status bar ─────────────────────────────────────────────── */
#status {
  position: fixed; bottom: 10px; right: 14px;
  background: #0f172acc; color: #94a3b8;
  font-size: 11px; padding: 3px 10px;
  border-radius: 5px; pointer-events: none; z-index: 20;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

/* ── Palette color section ──────────────────────────────────── */
.palette-section-title {
  font-size: 9px; color: #4b5563; text-transform: uppercase;
  letter-spacing: 1.5px; padding: 6px 5px 3px; font-weight: 700;
}
.palette-color-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 4px; padding: 2px 5px 6px;
}
.palette-color-swatch {
  width: 100%; aspect-ratio: 1; border-radius: 5px;
  cursor: pointer; border: 2px solid transparent;
  transition: border-color .12s, transform .1s;
}
.palette-color-swatch:hover  { transform: scale(1.12); }
.palette-color-swatch.active { border-color: #38bdf8; }
.palette-color-row {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 5px 6px;
}
.palette-color-row label { font-size: 10px; color: #6b7280; }
.palette-color-row input[type="color"] {
  width: 28px; height: 22px; border: 1px solid #334155;
  border-radius: 4px; cursor: pointer; padding: 1px;
  background: #1e293b;
}
.palette-sep {
  height: 1px; background: #1e2738; margin: 2px 5px 4px;
}
/* ── Import notice ──────────────────────────────────────────── */
#import-notice {
  position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
  background: #0f2744; border: 1px solid #38bdf8; border-radius: 10px;
  padding: 12px 18px; max-width: 520px; width: 90%;
  font-size: 11px; color: #cbd5e1; line-height: 1.7;
  z-index: 50; box-shadow: 0 8px 32px rgba(0,0,0,.6);
  display: none;
}
#import-notice strong { color: #38bdf8; }
#import-notice .tile-list { color: #fbbf24; font-family: monospace; font-size: 10px; }
#import-notice .close-notice {
  float: right; cursor: pointer; color: #6b7280; font-size: 14px; margin-left: 10px;
}
#btn-import { background: #1e3a5f; color: #38bdf8; border-color: #38bdf8; }
</style>
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────────── -->
<div id="toolbar">
  <div class="tg">
    <label>ID :</label>
    <input id="inp-id" type="text" value="ma_map" placeholder="nom_map">
  </div>
  <div class="tg">
    <label>Cols :</label><input id="inp-cols" type="number" value="22" min="4" max="60">
    <label>Lignes :</label><input id="inp-rows" type="number" value="16" min="4" max="40">
    <button id="btn-resize">↺</button>
  </div>
  <div class="tg">
    <button id="btn-load-tiles">🧱 Tuiles</button>
    <button id="btn-load-decos">🌲 Décos</button>
    <input id="file-tiles" type="file" accept="image/*" multiple style="display:none">
    <input id="file-decos" type="file" accept="image/*" multiple style="display:none">
  </div>
  <div class="tg">
    <button id="btn-eraser">🧹 Gomme</button>
    <button id="btn-fill">🪣 Remplir</button>
    <button id="btn-clear">🗑️ Vider</button>
  </div>
  <div class="tg" id="rot-group">
    <label>Rotation :</label>
    <button class="rot-btn active" data-rot="0">0°</button>
    <button class="rot-btn" data-rot="90">90°</button>
    <button class="rot-btn" data-rot="180">180°</button>
    <button class="rot-btn" data-rot="270">270°</button>
  </div>
  <div class="tg">
    <label>Zoom :</label>
    <input id="inp-zoom" type="number" value="100" min="25" max="300" step="5">
    <label>%</label>
  </div>
  <div class="tg">
    <button id="btn-import">📂 Ouvrir JSON</button>
    <button id="btn-export">💾 Exporter JSON</button>
    <input id="file-import" type="file" accept=".json,application/json" style="display:none">
  </div>
</div>

<div id="import-notice">
  <span class="close-notice" id="close-notice">✕</span>
  <div id="import-notice-body"></div>
</div>

<!-- ── Main ─────────────────────────────────────────────── -->
<div id="main">
  <div id="palette">
    <div class="mode-bar">
      <div class="mode-tab active" id="tab-tiles">🧱 Tuiles</div>
      <div class="mode-tab"       id="tab-decos">🌲 Décos</div>
      <div class="mode-tab"       id="tab-exits">🚪 Sorties</div>
      <div class="mode-tab"       id="tab-npcs">👤 PNJs</div>
    </div>
    <div id="palette-count">0 éléments</div>
    <div id="palette-list"></div>
    <div id="exit-palette" style="display:none"></div>
    <div id="npc-palette"  style="display:none"></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="map-canvas"></canvas>
    <div id="drop-hint">Déposer des images ici</div>
  </div>
</div>

<div id="status">Col: — · Ligne: —</div>

<!-- ── Script ───────────────────────────────────────────── -->
<script>
// ═══════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════
const BASE_TILE = 80;
const PAD = 36;

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let COLS = 22, ROWS = 16;
let zoom = 1.0;

// Calque tuiles : tileGrid[r][c] = index dans tiles[] (-1 = vide)
let tileGrid = [];
// Calque décorations : decoGrid[r][c] = { idx, rot } | null
let decoGrid = [];
// Calque sorties : exitGrid[r][c] = { targetMap, targetX, targetY } | null
let exitGrid = [];

let tiles  = [];    // { name, img, src, isColor? }
let decos  = [];    // { name, img, src }

// ── Dalles de couleur prédéfinies ──
const COLOR_TILES = [
  { label: 'Herbe',        color: '#5a8a3c' },
  { label: 'Herbe foncée', color: '#3d6b28' },
  { label: 'Terre',        color: '#8b6340' },
  { label: 'Sable',        color: '#c9a96e' },
  { label: 'Pierre',       color: '#7a7a8a' },
  { label: 'Pavé',         color: '#5a5a6e' },
  { label: 'Eau',          color: '#2e6b9e' },
  { label: 'Eau foncée',   color: '#1a4060' },
  { label: 'Neige',        color: '#d8e8f0' },
  { label: 'Bois',         color: '#7b5230' },
  { label: 'Lave',         color: '#c0392b' },
  { label: 'Marais',       color: '#4a6340' },
  { label: 'Noir',         color: '#1a1a1a' },
  { label: 'Blanc',        color: '#f0f0f0' },
  { label: 'Or',           color: '#c9a020' },
  { label: 'Violet',       color: '#5e3a7a' },
];

function makeColorTile(color, label) {
  const W = 128, H = 64;
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const oc = off.getContext('2d');
  // Losange isométrique plein
  oc.fillStyle = color;
  oc.beginPath();
  oc.moveTo(W / 2, 0);
  oc.lineTo(W, H / 2);
  oc.lineTo(W / 2, H);
  oc.lineTo(0, H / 2);
  oc.closePath();
  oc.fill();
  // Légère variation sur les faces pour donner du relief
  const lighter = color + '55';
  oc.fillStyle = lighter;
  oc.beginPath();
  oc.moveTo(W / 2, 0);
  oc.lineTo(W, H / 2);
  oc.lineTo(W / 2, H / 2);
  oc.closePath();
  oc.fill();
  const src = off.toDataURL('image/png');
  const img = new Image();
  img.src = src;
  return { name: `__color_${color}`, label, color, img, src, previewSrc: src, isColor: true };
}

let numColorTiles = 0;

// ══════════════════════════════════════════════════════════════
//  SPRITES DE DÉCORATION INTÉGRÉS
// ══════════════════════════════════════════════════════════════
function _sprite(drawFn, name) {
  const W = 128, H = 128;
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const oc = off.getContext('2d');
  drawFn(oc, W, H);
  const src = off.toDataURL('image/png');
  const img = new Image(); img.src = src;
  return { name: `__builtin_${name}`, label: name, img, src, previewSrc: src, isBuiltin: true };
}

function _drawTree(ctx, W, H) {
  const bx=W/2, by=H*.86;
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(bx,by,22,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#5c3318'; ctx.fillRect(bx-5,by-26,10,26);
  [[36,by-52],[27,by-74],[17,by-92]].forEach(([r,ty],i)=>{
    ctx.fillStyle=['#2a5c1a','#337722','#44992e'][i];
    ctx.beginPath(); ctx.moveTo(bx,ty-r); ctx.lineTo(bx+r,ty+r*.6); ctx.lineTo(bx-r,ty+r*.6); ctx.closePath(); ctx.fill();
  });
}

function _drawBush(ctx, W, H) {
  const bx=W/2, by=H*.82;
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(bx,by,28,8,0,0,Math.PI*2); ctx.fill();
  [[bx,by-18,20],[bx-16,by-12,16],[bx+16,by-12,16],[bx-8,by-30,14],[bx+8,by-30,14]].forEach(([x,y,r])=>{
    ctx.fillStyle='#2d6b22'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='#4a9938'; ctx.beginPath(); ctx.arc(bx-4,by-32,10,0,Math.PI*2); ctx.fill();
}

function _drawHouse(ctx, W, H) {
  const bx=W/2, by=H*.88;
  // Mur gauche
  ctx.fillStyle='#b8936a';
  ctx.beginPath(); ctx.moveTo(bx,by-8); ctx.lineTo(bx-38,by-26); ctx.lineTo(bx-38,by-56); ctx.lineTo(bx,by-38); ctx.closePath(); ctx.fill();
  // Mur droit
  ctx.fillStyle='#d4aa80';
  ctx.beginPath(); ctx.moveTo(bx,by-8); ctx.lineTo(bx+38,by-26); ctx.lineTo(bx+38,by-56); ctx.lineTo(bx,by-38); ctx.closePath(); ctx.fill();
  // Toit gauche
  ctx.fillStyle='#8b3a2a';
  ctx.beginPath(); ctx.moveTo(bx,by-38); ctx.lineTo(bx-38,by-56); ctx.lineTo(bx-22,by-72); ctx.lineTo(bx,by-58); ctx.closePath(); ctx.fill();
  // Toit droit
  ctx.fillStyle='#a04535';
  ctx.beginPath(); ctx.moveTo(bx,by-38); ctx.lineTo(bx+38,by-56); ctx.lineTo(bx+22,by-72); ctx.lineTo(bx,by-58); ctx.closePath(); ctx.fill();
  // Faîte
  ctx.fillStyle='#6a2a1a';
  ctx.beginPath(); ctx.moveTo(bx,by-58); ctx.lineTo(bx-22,by-72); ctx.lineTo(bx+22,by-72); ctx.closePath(); ctx.fill();
  // Porte
  ctx.fillStyle='#5a3318'; ctx.fillRect(bx+8,by-40,14,30);
  // Fenêtre
  ctx.fillStyle='#a8d4f0'; ctx.fillRect(bx-30,by-48,14,12);
  ctx.strokeStyle='#5a3318'; ctx.lineWidth=1.5; ctx.strokeRect(bx-30,by-48,14,12);
}

function _drawWell(ctx, W, H) {
  const bx=W/2, by=H*.86;
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(bx,by,22,7,0,0,Math.PI*2); ctx.fill();
  // Corps pierre
  ctx.fillStyle='#6a6a7a'; ctx.fillRect(bx-22,by-30,44,26);
  ctx.fillStyle='#888899'; ctx.beginPath(); ctx.ellipse(bx,by-30,22,9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#888899'; ctx.beginPath(); ctx.ellipse(bx,by-4,22,9,0,0,Math.PI*2); ctx.fill();
  // Poteaux
  ctx.fillStyle='#5c3318'; ctx.fillRect(bx-18,by-64,7,34); ctx.fillRect(bx+11,by-64,7,34);
  // Traverse
  ctx.fillRect(bx-18,by-64,36,7);
  // Corde + seau
  ctx.strokeStyle='#8b6040'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(bx,by-57); ctx.lineTo(bx,by-38); ctx.stroke();
  ctx.fillStyle='#a0742c'; ctx.fillRect(bx-5,by-38,10,9);
}

function _drawBarrel(ctx, W, H) {
  const bx=W/2, by=H*.86;
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(bx,by,18,6,0,0,Math.PI*2); ctx.fill();
  const g=ctx.createLinearGradient(bx-16,0,bx+16,0);
  g.addColorStop(0,'#6b3a1a'); g.addColorStop(.4,'#8b5230'); g.addColorStop(1,'#5a2a10');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(bx,by-44,18,6,0,0,Math.PI*2); ctx.fill();
  ctx.fillRect(bx-18,by-44,36,40);
  ctx.beginPath(); ctx.ellipse(bx,by-4,18,6,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#3a1a08'; ctx.lineWidth=3;
  [by-14,by-24,by-34].forEach(y=>{ ctx.beginPath(); ctx.ellipse(bx,y,18,6,0,0,Math.PI*2); ctx.stroke(); });
  ctx.fillStyle='#7b4a22'; ctx.beginPath(); ctx.ellipse(bx,by-44,18,6,0,0,Math.PI*2); ctx.fill();
}

function _drawCampfire(ctx, W, H) {
  const bx=W/2, by=H*.86;
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(bx,by,20,7,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#5c3318'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(bx-18,by); ctx.lineTo(bx+8,by-18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx+18,by); ctx.lineTo(bx-8,by-18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx-10,by+2); ctx.lineTo(bx+10,by+2); ctx.stroke();
  [[bx,by-40,'#ff4400',10],[bx-6,by-30,'#ff8800',7],[bx+6,by-32,'#ff6600',8],[bx,by-24,'#ffcc00',6]].forEach(([fx,fy,col,r])=>{
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(fx-r,fy+r*2); ctx.quadraticCurveTo(fx-r*1.2,fy,fx,fy-r*2); ctx.quadraticCurveTo(fx+r*1.2,fy,fx+r,fy+r*2); ctx.closePath(); ctx.fill();
  });
}

function _drawChest(ctx, W, H) {
  const bx=W/2, by=H*.86;
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(bx,by,24,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7b4a1a'; ctx.fillRect(bx-22,by-30,44,28);
  ctx.fillStyle='#5a3310';
  ctx.beginPath(); ctx.moveTo(bx-22,by-30); ctx.lineTo(bx-32,by-22); ctx.lineTo(bx-32,by-2); ctx.lineTo(bx-22,by-2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#9b6228'; ctx.fillRect(bx-22,by-38,44,10);
  ctx.fillStyle='#7a4a18';
  ctx.beginPath(); ctx.moveTo(bx-22,by-38); ctx.lineTo(bx-32,by-30); ctx.lineTo(bx-32,by-22); ctx.lineTo(bx-22,by-30); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#c8a030'; ctx.lineWidth=2.5;
  ctx.strokeRect(bx-22,by-38,44,38);
  ctx.beginPath(); ctx.moveTo(bx,by-38); ctx.lineTo(bx,by+2); ctx.stroke();
  ctx.fillStyle='#c8a030'; ctx.beginPath(); ctx.arc(bx,by-22,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8b6820'; ctx.beginPath(); ctx.arc(bx,by-22,3,0,Math.PI*2); ctx.fill();
}

function _drawMushroom(ctx, W, H) {
  const bx=W/2, by=H*.86;
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(bx,by,16,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e8dcc8';
  ctx.beginPath(); ctx.moveTo(bx-8,by); ctx.lineTo(bx+8,by); ctx.lineTo(bx+6,by-30); ctx.lineTo(bx-6,by-30); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f0e8d8'; ctx.beginPath(); ctx.ellipse(bx,by-30,26,9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c0301a';
  ctx.beginPath(); ctx.arc(bx,by-48,26,0,Math.PI,true); ctx.lineTo(bx-26,by-30); ctx.lineTo(bx+26,by-30); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.75)';
  [[bx-10,by-52,5],[bx+10,by-50,4],[bx,by-42,4],[bx-18,by-44,3]].forEach(([x,y,r])=>{
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  });
}

let mode         = 'tiles';  // 'tiles' | 'decos' | 'exits'
let selectedIdx  = -1;
let currentRot   = 0;        // 0 | 90 | 180 | 270
let eraserMode   = false;
let isPainting   = false;

// Config exit active
let exitConfig = { targetMap: '', targetX: 0, targetY: 0 };

// Calque NPCs : npcGrid[r][c] = { id, name, firstDialogues, repeatDialogues } | null
let npcGrid = [];

// Config NPC active (formulaire panneau PNJs)
let npcConfig = { id: '', name: '', firstDialogues: '', repeatDialogues: '' };

// Manifest importé : index → nom de fichier attendu
let importedTileManifest = {};   // { "0": "filename.jpeg", ... }
let importedDecoSprites  = {};   // { "spriteName": [{ r, c, rot }] } (placeholders)

const canvas = document.getElementById('map-canvas');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvas-wrap');

// ═══════════════════════════════════════════════
//  DIMENSIONS
// ═══════════════════════════════════════════════
const ts  = () => Math.round(BASE_TILE * zoom);
const xs  = () => Math.round(ts() / 2);
const ys  = () => Math.round(ts() / 4);
const ox  = () => PAD + (ROWS - 1) * xs();
const oy  = () => PAD + Math.round(ts() * 0.05);

// ═══════════════════════════════════════════════
//  GRID
// ═══════════════════════════════════════════════
function initGrids(preserve = false) {
  const oldT = tileGrid, oldD = decoGrid, oldE = exitGrid, oldN = npcGrid;
  tileGrid = Array.from({ length: ROWS }, (_, r) =>
    Array.from({ length: COLS }, (_, c) =>
      preserve && oldT[r] ? (oldT[r][c] ?? -1) : -1));
  decoGrid = Array.from({ length: ROWS }, (_, r) =>
    Array.from({ length: COLS }, (_, c) =>
      preserve && oldD[r] ? (oldD[r][c] ?? null) : null));
  exitGrid = Array.from({ length: ROWS }, (_, r) =>
    Array.from({ length: COLS }, (_, c) =>
      preserve && oldE[r] ? (oldE[r][c] ?? null) : null));
  npcGrid = Array.from({ length: ROWS }, (_, r) =>
    Array.from({ length: COLS }, (_, c) =>
      preserve && oldN[r] ? (oldN[r][c] ?? null) : null));
}

// ═══════════════════════════════════════════════
//  COORDINATES
// ═══════════════════════════════════════════════
function g2s(col, row) {
  return { x: ox() + (col - row) * xs(), y: oy() + (col + row) * ys() };
}
function s2g(sx, sy) {
  const u = (sx - ox()) / xs();
  const v = (sy - oy()) / ys();
  return { col: Math.floor((u + v) / 2 + 0.5), row: Math.floor((v - u) / 2 + 0.5) };
}
function inBounds(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS; }
function tileCenterX(col, row) { return g2s(col, row).x; }
function tileCenterY(col, row) { return g2s(col, row).y + ys(); }

// ═══════════════════════════════════════════════
//  CANVAS SIZE
// ═══════════════════════════════════════════════
function resizeCanvas() {
  canvas.width  = PAD * 2 + (COLS + ROWS - 1) * xs() + ts();
  canvas.height = PAD * 2 + (COLS + ROWS - 1) * ys() + ts();
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const T = ts(), X = xs(), Y = ys();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const { x, y } = g2s(c, r);
      const ti = tileGrid[r][c];

      if (ti >= 0 && tiles[ti]) {
        ctx.drawImage(tiles[ti].img, x - T / 2, y, T, T);
      } else {
        ctx.save();
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(200,213,224,0.35)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(x,       y);
        ctx.lineTo(x + X,   y + Y);
        ctx.lineTo(x,       y + Y * 2);
        ctx.lineTo(x - X,   y + Y);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      // ── Déco ──
      const d = decoGrid[r][c];
      if (d !== null) {
        const cx = tileCenterX(c, r);
        const cy = tileCenterY(c, r);
        if (d.idx >= 0 && decos[d.idx]) {
          drawSprite(decos[d.idx].img, cx, cy, T * 1.8, d.rot);
        } else if (d.idx === -1) {
          // Placeholder : image pas encore chargée
          ctx.save();
          ctx.globalAlpha = 0.55;
          ctx.fillStyle = '#7c3aed';
          ctx.beginPath();
          ctx.moveTo(cx, cy - Y);
          ctx.lineTo(cx + X * 0.6, cy);
          ctx.lineTo(cx, cy + Y);
          ctx.lineTo(cx - X * 0.6, cy);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
          const lbl = (d.spriteName || '?').slice(0, 6);
          ctx.fillStyle = '#e9d5ff';
          ctx.font = `bold ${Math.max(7, Math.round(Y * 0.9))}px monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(lbl, cx, cy);
          ctx.restore();
        }
      }

      // ── Sortie ──
      const ex = exitGrid[r][c];
      if (ex !== null) {
        ctx.save();
        // Overlay orange semi-transparent
        ctx.globalAlpha = 0.50;
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(x,       y);
        ctx.lineTo(x + X,   y + Y);
        ctx.lineTo(x,       y + Y * 2);
        ctx.lineTo(x - X,   y + Y);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
        // Contour
        ctx.strokeStyle = '#fb923c';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Icône porte
        const fs = Math.max(8, Math.round(Y * 1.6));
        ctx.font = `${fs}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🚪', x, y + Y);
        ctx.restore();
      }

      // ── NPC ──
      const npc = npcGrid[r][c];
      if (npc !== null) {
        ctx.save();
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = '#7c3aed';
        ctx.beginPath();
        ctx.moveTo(x,       y);
        ctx.lineTo(x + X,   y + Y);
        ctx.lineTo(x,       y + Y * 2);
        ctx.lineTo(x - X,   y + Y);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#a78bfa';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        const fs = Math.max(8, Math.round(Y * 1.6));
        ctx.font = `${fs}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('👤', x, y + Y);
        // Nom sous l'icône
        if (npc.name) {
          ctx.font = `bold ${Math.max(6, Math.round(Y * 0.75))}px sans-serif`;
          ctx.fillStyle = '#e9d5ff';
          ctx.fillText(npc.name.slice(0, 12), x, y + Y * 2 + 4);
        }
        ctx.restore();
      }
    }
  }
}

function drawSprite(img, cx, cy, ds, deg) {
  const pivotY = cy - ds * 0.82 + ds * 0.5;
  ctx.save();
  ctx.translate(cx, pivotY);
  if (deg) ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(img, -ds / 2, -ds * 0.5, ds, ds);
  ctx.restore();
}

// ═══════════════════════════════════════════════
//  PALETTE
// ═══════════════════════════════════════════════
function refreshPalette() {
  const pList  = document.getElementById('palette-list');
  const pExit  = document.getElementById('exit-palette');
  const pNpc   = document.getElementById('npc-palette');
  const count  = document.getElementById('palette-count');

  if (mode === 'exits') {
    pList.style.display = 'none';
    pExit.style.display = 'flex';
    pNpc.style.display  = 'none';
    count.textContent = `${countExits()} sortie${countExits() !== 1 ? 's' : ''} placée${countExits() !== 1 ? 's' : ''}`;
    renderExitPalette(pExit);
    return;
  }

  if (mode === 'npcs') {
    pList.style.display = 'none';
    pExit.style.display = 'none';
    pNpc.style.display  = 'flex';
    const n = countNpcs();
    count.textContent = `${n} PNJ${n !== 1 ? 's' : ''} placé${n !== 1 ? 's' : ''}`;
    renderNpcPalette(pNpc);
    return;
  }

  pList.style.display = 'flex';
  pExit.style.display = 'none';
  pNpc.style.display  = 'none';
  pList.innerHTML = '';

  if (mode === 'tiles') {
    // ── Section dalles de couleur ──
    const secTitle = document.createElement('div');
    secTitle.className = 'palette-section-title';
    secTitle.textContent = '🎨 Dalles de couleur';
    pList.appendChild(secTitle);

    const grid = document.createElement('div');
    grid.className = 'palette-color-grid';
    tiles.forEach((t, i) => {
      if (!t.isColor) return;
      const sw = document.createElement('div');
      sw.className = 'palette-color-swatch' + (selectedIdx === i ? ' active' : '');
      sw.style.background = t.color;
      sw.title = t.label;
      sw.addEventListener('click', () => {
        selectedIdx = i; eraserMode = false;
        document.getElementById('btn-eraser').classList.remove('active');
        refreshPalette();
      });
      grid.appendChild(sw);
    });
    pList.appendChild(grid);

    // ── Couleur personnalisée ──
    const colorRow = document.createElement('div');
    colorRow.className = 'palette-color-row';
    const colorLbl = document.createElement('label');
    colorLbl.textContent = 'Custom :';
    const colorPicker = document.createElement('input');
    colorPicker.type = 'color'; colorPicker.value = '#ff6600';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ Ajouter';
    addBtn.style.cssText = 'font-size:10px;padding:3px 7px;flex:1;';
    addBtn.addEventListener('click', () => {
      const t = makeColorTile(colorPicker.value, colorPicker.value);
      tiles.push(t);
      selectedIdx = tiles.length - 1;
      eraserMode = false;
      refreshPalette();
    });
    colorRow.append(colorLbl, colorPicker, addBtn);
    pList.appendChild(colorRow);

    // ── Séparateur + tuiles image ──
    const userTiles = tiles.filter(t => !t.isColor);
    if (userTiles.length > 0) {
      const sep = document.createElement('div'); sep.className = 'palette-sep'; pList.appendChild(sep);
      const secTitle2 = document.createElement('div');
      secTitle2.className = 'palette-section-title';
      secTitle2.textContent = '🖼️ Tuiles image';
      pList.appendChild(secTitle2);
    }

    tiles.forEach((t, i) => {
      if (t.isColor) return;
      const item = document.createElement('div');
      item.className = 'palette-item' + (selectedIdx === i ? ' active' : '');
      const img = document.createElement('img');
      img.className = 'palette-thumb'; img.src = t.previewSrc || t.src;
      const info = document.createElement('div'); info.style.minWidth = 0;
      const lbl = document.createElement('div'); lbl.className = 'palette-label';
      let name = t.name.replace(/\.[^.]+$/, '');
      if (name.length > 22) name = name.slice(0, 20) + '…';
      lbl.textContent = name; info.appendChild(lbl);
      item.append(img, info);
      item.addEventListener('click', () => {
        selectedIdx = i; eraserMode = false;
        document.getElementById('btn-eraser').classList.remove('active');
        refreshPalette();
      });
      pList.appendChild(item);
    });

    count.textContent = `${tiles.filter(t=>!t.isColor).length} image(s) · ${tiles.filter(t=>t.isColor).length} couleur(s)`;
  } else {
    // ── Mode décos ──
    const userDecos = decos.filter(t => !t.isBuiltin);
    count.textContent = `${numBuiltinDecos} intégrés · ${userDecos.length} chargé${userDecos.length !== 1 ? 's' : ''}`;

    // Section sprites intégrés
    const secB = document.createElement('div');
    secB.className = 'palette-section-title'; secB.textContent = '🧱 Sprites intégrés';
    pList.appendChild(secB);

    decos.forEach((t, i) => {
      if (!t.isBuiltin) return;
      const item = document.createElement('div');
      item.className = 'palette-item' + (selectedIdx === i ? ' active' : '');
      const img = document.createElement('img');
      img.className = 'palette-thumb'; img.src = t.previewSrc || t.src;
      const info = document.createElement('div'); info.style.minWidth = 0;
      const lbl = document.createElement('div'); lbl.className = 'palette-label';
      lbl.textContent = t.label || t.name; info.appendChild(lbl);
      item.append(img, info);
      item.addEventListener('click', () => {
        selectedIdx = i; eraserMode = false;
        document.getElementById('btn-eraser').classList.remove('active');
        refreshPalette();
      });
      pList.appendChild(item);
    });

    // Section sprites chargés depuis fichiers
    if (userDecos.length > 0) {
      const sep = document.createElement('div'); sep.className = 'palette-sep'; pList.appendChild(sep);
      const secU = document.createElement('div');
      secU.className = 'palette-section-title'; secU.textContent = '🖼️ Sprites chargés';
      pList.appendChild(secU);

      decos.forEach((t, i) => {
        if (t.isBuiltin) return;
        const item = document.createElement('div');
        item.className = 'palette-item' + (selectedIdx === i ? ' active' : '');
        const img = document.createElement('img');
        img.className = 'palette-thumb'; img.src = t.previewSrc || t.src;
        const info = document.createElement('div'); info.style.minWidth = 0;
        const lbl = document.createElement('div'); lbl.className = 'palette-label';
        let name = t.name.replace(/\.[^.]+$/, '');
        if (name.length > 22) name = name.slice(0, 20) + '…';
        lbl.textContent = name; info.appendChild(lbl);
        item.append(img, info);
        item.addEventListener('click', () => {
          selectedIdx = i; eraserMode = false;
          document.getElementById('btn-eraser').classList.remove('active');
          refreshPalette();
        });
        pList.appendChild(item);
      });
    }
  }

  document.getElementById('rot-group').style.opacity = mode === 'decos' ? '1' : '0.35';
}

function countNpcs() {
  let n = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (npcGrid[r][c]) n++;
  return n;
}

function renderNpcPalette(container) {
  container.innerHTML = '';

  function nfield(labelText, inputId, inputType, value, placeholder, rows) {
    const wrap = document.createElement('div');
    wrap.className = 'npc-field';
    const lbl = document.createElement('label');
    lbl.textContent = labelText; lbl.htmlFor = inputId;
    let inp;
    if (rows) {
      inp = document.createElement('textarea');
      inp.rows = rows;
    } else {
      inp = document.createElement('input');
      inp.type = inputType;
    }
    inp.id = inputId; inp.value = value; if (placeholder) inp.placeholder = placeholder;
    wrap.append(lbl, inp);
    return { wrap, inp };
  }

  const fTitle = document.createElement('div');
  fTitle.className = 'npc-list-title';
  fTitle.textContent = '⚙️  Configuration du PNJ';
  container.appendChild(fTitle);

  const fId = nfield('ID (unique)', 'nc-id', 'text', npcConfig.id, 'ex: prof_aldren');
  fId.inp.addEventListener('input', e => { npcConfig.id = e.target.value.trim(); });
  container.appendChild(fId.wrap);

  const fName = nfield('Nom affiché', 'nc-name', 'text', npcConfig.name, 'ex: Professeur Aldren');
  fName.inp.addEventListener('input', e => { npcConfig.name = e.target.value; });
  container.appendChild(fName.wrap);

  const fFirst = nfield('Premiers dialogues (1 par ligne)', 'nc-first', null, npcConfig.firstDialogues, 'Bonjour aventurier !', 4);
  fFirst.inp.addEventListener('input', e => { npcConfig.firstDialogues = e.target.value; });
  container.appendChild(fFirst.wrap);

  const fRepeat = nfield('Dialogues répétés (1 par ligne)', 'nc-repeat', null, npcConfig.repeatDialogues, 'Bonne route !', 3);
  fRepeat.inp.addEventListener('input', e => { npcConfig.repeatDialogues = e.target.value; });
  container.appendChild(fRepeat.wrap);

  const hint = document.createElement('div');
  hint.className = 'npc-hint';
  hint.textContent = '🖱️ Clic gauche : placer le PNJ  ·  Clic droit : supprimer';
  container.appendChild(hint);

  const sep = document.createElement('hr'); sep.className = 'exit-separator';
  container.appendChild(sep);

  const listTitle = document.createElement('div');
  listTitle.className = 'npc-list-title';
  listTitle.textContent = '📋  PNJs placés';
  container.appendChild(listTitle);

  let hasAny = false;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const npc = npcGrid[r][c];
      if (!npc) continue;
      hasAny = true;

      const item = document.createElement('div');
      item.className = 'npc-list-item';

      const removeBtn = document.createElement('span');
      removeBtn.className = 'npc-remove';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Supprimer';
      removeBtn.addEventListener('click', e => {
        e.stopPropagation();
        npcGrid[r][c] = null;
        render(); refreshPalette();
      });

      item.innerHTML =
        `<span class="npc-coords">(${c}, ${r})</span> ` +
        `<span class="npc-name">${npc.name || npc.id || '?'}</span>`;
      item.appendChild(removeBtn);

      item.addEventListener('click', () => {
        npcConfig = {
          id: npc.id,
          name: npc.name,
          firstDialogues:  npc.firstDialogues.join('\n'),
          repeatDialogues: npc.repeatDialogues.join('\n'),
        };
        refreshPalette();
      });

      container.appendChild(item);
    }
  }

  if (!hasAny) {
    const empty = document.createElement('div');
    empty.style.cssText = 'font-size:10px;color:#374151;text-align:center;padding:12px 0;';
    empty.textContent = 'Aucun PNJ placé';
    container.appendChild(empty);
  }
}

function countExits() {
  let n = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (exitGrid[r][c]) n++;
  return n;
}

function renderExitPalette(container) {
  container.innerHTML = '';

  // ── Config form ──
  const formTitle = document.createElement('div');
  formTitle.className = 'exit-list-title';
  formTitle.textContent = '⚙️  Configuration de la sortie';
  container.appendChild(formTitle);

  function field(labelText, inputId, inputType, value, placeholder) {
    const wrap = document.createElement('div');
    wrap.className = 'exit-field';
    const lbl = document.createElement('label');
    lbl.textContent = labelText;
    lbl.htmlFor = inputId;
    const inp = document.createElement('input');
    inp.id = inputId; inp.type = inputType; inp.value = value; inp.placeholder = placeholder || '';
    wrap.append(lbl, inp);
    return { wrap, inp };
  }

  const fMap = field('Map cible (ID)', 'ec-map', 'text', exitConfig.targetMap, 'ex: map_s');
  fMap.inp.addEventListener('input', e => { exitConfig.targetMap = e.target.value.trim(); });
  container.appendChild(fMap.wrap);

  const fX = field('Position X (cible)', 'ec-x', 'number', exitConfig.targetX, '10');
  fX.inp.style.width = '100%';
  fX.inp.addEventListener('input', e => { exitConfig.targetX = parseInt(e.target.value) || 0; });
  container.appendChild(fX.wrap);

  const fY = field('Position Y (cible)', 'ec-y', 'number', exitConfig.targetY, '7');
  fY.inp.style.width = '100%';
  fY.inp.addEventListener('input', e => { exitConfig.targetY = parseInt(e.target.value) || 0; });
  container.appendChild(fY.wrap);

  const hint = document.createElement('div');
  hint.className = 'exit-hint';
  hint.textContent = '🖱️ Clic gauche : poser une sortie  ·  Clic droit : supprimer';
  container.appendChild(hint);

  const sep = document.createElement('hr');
  sep.className = 'exit-separator';
  container.appendChild(sep);

  // ── Liste des sorties placées ──
  const listTitle = document.createElement('div');
  listTitle.className = 'exit-list-title';
  listTitle.textContent = '📋  Sorties placées';
  container.appendChild(listTitle);

  let hasAny = false;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ex = exitGrid[r][c];
      if (!ex) continue;
      hasAny = true;

      const item = document.createElement('div');
      item.className = 'exit-list-item';

      const removeBtn = document.createElement('span');
      removeBtn.className = 'exit-remove';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Supprimer';
      removeBtn.addEventListener('click', e => {
        e.stopPropagation();
        exitGrid[r][c] = null;
        render();
        refreshPalette();
      });

      item.innerHTML =
        `<span class="exit-coords">(${c}, ${r})</span> → ` +
        `<span class="exit-target">${ex.targetMap || '?'}</span> ` +
        `<span style="color:#6b7280">@ (${ex.targetX}, ${ex.targetY})</span>`;
      item.appendChild(removeBtn);

      // Clic pour pré-remplir la config avec les valeurs de cette sortie
      item.addEventListener('click', () => {
        exitConfig = { targetMap: ex.targetMap, targetX: ex.targetX, targetY: ex.targetY };
        refreshPalette();
      });

      container.appendChild(item);
    }
  }

  if (!hasAny) {
    const empty = document.createElement('div');
    empty.style.cssText = 'font-size:10px;color:#374151;text-align:center;padding:12px 0;';
    empty.textContent = 'Aucune sortie placée';
    container.appendChild(empty);
  }
}

// ═══════════════════════════════════════════════
//  PAINT / PLACE
// ═══════════════════════════════════════════════
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    sx: (e.clientX - rect.left)  * (canvas.width  / rect.width),
    sy: (e.clientY - rect.top)   * (canvas.height / rect.height),
  };
}

function paintAt(e) {
  const { sx, sy } = getCanvasPos(e);
  const { col, row } = s2g(sx, sy);
  if (!inBounds(col, row)) return;

  // ── Mode sortie ──
  if (mode === 'exits') {
    if (eraserMode) {
      exitGrid[row][col] = null;
    } else {
      if (!exitConfig.targetMap) { alert('Renseigne la Map cible dans la palette Sorties.'); return; }
      exitGrid[row][col] = { ...exitConfig };
    }
    render();
    refreshPalette();
    return;
  }

  // ── Mode NPC ──
  if (mode === 'npcs') {
    if (eraserMode) {
      npcGrid[row][col] = null;
    } else {
      if (!npcConfig.id) { alert('Renseigne l\'ID du PNJ dans la palette PNJs.'); return; }
      npcGrid[row][col] = {
        id:              npcConfig.id,
        name:            npcConfig.name,
        firstDialogues:  npcConfig.firstDialogues.split('\n').map(s => s.trim()).filter(Boolean),
        repeatDialogues: npcConfig.repeatDialogues.split('\n').map(s => s.trim()).filter(Boolean),
      };
    }
    render();
    refreshPalette();
    return;
  }

  // ── Mode tuiles / décos ──
  if (eraserMode) {
    if (mode === 'tiles') tileGrid[row][col] = -1;
    else decoGrid[row][col] = null;
    render();
    return;
  }

  if (selectedIdx < 0) return;

  if (mode === 'tiles') {
    if (!tiles[selectedIdx]) return;
    if (tileGrid[row][col] === selectedIdx) return;
    tileGrid[row][col] = selectedIdx;
  } else {
    if (!decos[selectedIdx]) return;
    const cur = decoGrid[row][col];
    if (cur && cur.idx === selectedIdx && cur.rot === currentRot) return;
    decoGrid[row][col] = { idx: selectedIdx, rot: currentRot };
  }
  render();
}

// Clic droit = effacer
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const { sx, sy } = getCanvasPos(e);
  const { col, row } = s2g(sx, sy);
  if (!inBounds(col, row)) return;
  if (mode === 'exits') {
    exitGrid[row][col] = null;
    render(); refreshPalette();
  } else if (mode === 'npcs') {
    npcGrid[row][col] = null;
    render(); refreshPalette();
  } else if (mode === 'decos') {
    decoGrid[row][col] = null; render();
  } else {
    tileGrid[row][col] = -1; render();
  }
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) { isPainting = true; paintAt(e); }
});
canvas.addEventListener('mousemove', e => {
  const { sx, sy } = getCanvasPos(e);
  const { col, row } = s2g(sx, sy);
  const ok = inBounds(col, row);
  let info = ok ? `Col: ${col}  ·  Ligne: ${row}` : 'Col: —  ·  Ligne: —';
  if (ok && mode === 'decos') info += `  ·  Rot: ${currentRot}°`;
  if (ok && mode === 'exits' && exitGrid[row][col]) info += `  ·  → ${exitGrid[row][col].targetMap}`;
  if (ok && mode === 'npcs'  && npcGrid[row][col])  info += `  ·  👤 ${npcGrid[row][col].name || npcGrid[row][col].id}`;
  document.getElementById('status').textContent = info;
  if (isPainting && e.button === 0 && mode !== 'exits' && mode !== 'npcs') paintAt(e);
});

// ═══════════════════════════════════════════════
//  FOND BLANC → TRANSPARENT
// ═══════════════════════════════════════════════
function removeWhite(sourceImg) {
  const W = sourceImg.naturalWidth  || sourceImg.width;
  const H = sourceImg.naturalHeight || sourceImg.height;
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const oc = off.getContext('2d');
  oc.drawImage(sourceImg, 0, 0);
  const id = oc.getImageData(0, 0, W, H);
  const d  = id.data;
  const THR = 240;
  const isW = i => d[i] > THR && d[i+1] > THR && d[i+2] > THR;
  const vis = new Uint8Array(W * H);
  const q = [];
  const enq = (x, y) => {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const n = y * W + x; if (vis[n]) return;
    if (!isW(n * 4)) return;
    vis[n] = 1; q.push(x, y);
  };
  enq(0,0); enq(W-1,0); enq(0,H-1); enq(W-1,H-1);
  let qi = 0;
  while (qi < q.length) {
    const x = q[qi++], y = q[qi++];
    const p = (y * W + x) * 4;
    d[p]=255; d[p+1]=255; d[p+2]=255; d[p+3]=0;
    enq(x+1,y); enq(x-1,y); enq(x,y+1); enq(x,y-1);
  }
  for (let i = 0; i < d.length; i += 4) {
    if (d[i+3] === 0) continue;
    const b = (d[i]+d[i+1]+d[i+2])/3;
    if (b > 220) d[i+3] = Math.round(d[i+3] * (1-(b-220)/35));
  }
  oc.putImageData(id, 0, 0);
  const r = new Image(); r.src = off.toDataURL('image/png'); return r;
}

// ═══════════════════════════════════════════════
//  LOAD FILES
// ═══════════════════════════════════════════════
function loadFiles(files, targetArray) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!arr.length) return;
  let done = 0;
  arr.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const raw = new Image();
      raw.onload = () => {
        const clean = removeWhite(raw);
        const finish = () => {
          targetArray.push({ name: file.name, img: clean, src: clean.src, previewSrc: ev.target.result });
          done++;
          if (done === arr.length) {
            if (selectedIdx < 0) selectedIdx = 0;
            if (targetArray === tiles) tryMatchTilesAfterLoad();
            if (targetArray === decos) tryMatchDecosAfterLoad();
            refreshPalette();
            render();
          }
        };
        clean.complete && clean.naturalWidth ? finish() : (clean.onload = finish);
      };
      raw.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('btn-export').addEventListener('click', () => {
  const mapId = document.getElementById('inp-id').value.trim() || 'ma_map';

  // ── Manifest tuiles ──
  const usedTiles = new Set();
  for (const row of tileGrid) for (const v of row) if (v >= 0) usedTiles.add(v);
  const tileManifest = {};
  usedTiles.forEach(i => { tileManifest[i] = tiles[i].name; });

  // ── Décorations ──
  const decorations = [];
  let dIdx = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const d = decoGrid[r][c];
      if (d !== null && decos[d.idx]) {
        const name = decos[d.idx].name;
        const spriteId = name.replace(/\.[^.]+$/, '');
        const entry = {
          id: `d_${mapId}_${dIdx++}`,
          sprite: spriteId,
          x: c,
          y: r,
          scale: 1.0,
        };
        if (d.rot !== 0) entry.rotation = d.rot;
        decorations.push(entry);
      }
    }
  }

  // ── Sorties ──
  const exits = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ex = exitGrid[r][c];
      if (ex) {
        exits.push({
          from: { x: c, y: r },
          targetMap: ex.targetMap,
          targetX: ex.targetX,
          targetY: ex.targetY,
        });
      }
    }
  }

  // ── NPCs ──
  const npcs = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const npc = npcGrid[r][c];
      if (npc) npcs.push({ ...npc, x: c, y: r });
    }
  }

  const hasTileManifest = Object.keys(tileManifest).length > 0;
  const data = {
    id: mapId,
    width: COLS,
    height: ROWS,
    zone: mapId,
    coords: [0, 0],
    ...(hasTileManifest ? { tilesPath: 'Assets/tiles/', tileManifest } : {}),
    tiles: tileGrid.map(row => [...row]),
    exits,
    spawns: [],
    chests: [],
    npcs,
    decorations,
  };

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a'); a.href = url;
  a.download = `${mapId}.json`; a.click();
  URL.revokeObjectURL(url);

  console.log(`✅ Export "${mapId}.json" — ${COLS}×${ROWS}, ${usedTiles.size} tuile(s), ${decorations.length} déco(s), ${exits.length} sortie(s)`);
});

// ═══════════════════════════════════════════════
//  IMPORT JSON
// ═══════════════════════════════════════════════
function importMap(data) {
  // ── Dimensions & ID ──
  COLS = data.width  || COLS;
  ROWS = data.height || ROWS;
  document.getElementById('inp-cols').value = COLS;
  document.getElementById('inp-rows').value = ROWS;
  document.getElementById('inp-id').value   = data.id || 'ma_map';

  // ── Réinitialise les grilles ──
  tiles = []; decos = []; selectedIdx = -1;
  importedTileManifest = {};
  importedDecoSprites  = {};
  initColorTiles();
  initBuiltinDecos();
  initGrids();
  resizeCanvas();

  // ── Tuiles ──
  if (data.tiles) {
    for (let r = 0; r < Math.min(ROWS, data.tiles.length); r++) {
      const row = data.tiles[r] || [];
      for (let c = 0; c < Math.min(COLS, row.length); c++) {
        tileGrid[r][c] = row[c] ?? -1;
      }
    }
  }
  if (data.tileManifest) {
    importedTileManifest = data.tileManifest;
    restoreColorTilesFromManifest(data.tileManifest);
  }

  // ── Sorties ──
  if (data.exits) {
    for (const ex of data.exits) {
      const c = ex.from?.x ?? ex.x ?? -1;
      const r = ex.from?.y ?? ex.y ?? -1;
      if (inBounds(c, r)) {
        exitGrid[r][c] = { targetMap: ex.targetMap, targetX: ex.targetX, targetY: ex.targetY };
      }
    }
  }

  // ── NPCs ──
  if (data.npcs) {
    for (const npc of data.npcs) {
      const c = npc.x ?? -1, r = npc.y ?? -1;
      if (inBounds(c, r)) {
        npcGrid[r][c] = {
          id:              npc.id || '',
          name:            npc.name || '',
          firstDialogues:  npc.firstDialogues  || [],
          repeatDialogues: npc.repeatDialogues || [],
        };
      }
    }
  }

  // ── Décorations ──
  if (data.decorations) {
    for (const d of data.decorations) {
      if (!inBounds(d.x, d.y)) continue;
      const spriteName = d.sprite || '';
      // Builtins : restaurés directement sans chargement fichier
      if (spriteName.startsWith('__builtin_')) {
        const label = spriteName.replace('__builtin_', '');
        const builtinIdx = decos.findIndex(b => b.isBuiltin && b.label === label);
        if (builtinIdx >= 0) {
          decoGrid[d.y][d.x] = { idx: builtinIdx, rot: d.rotation ?? 0 };
          continue;
        }
      }
      // idx=-1 = placeholder (image pas encore chargée)
      decoGrid[d.y][d.x] = { idx: -1, rot: d.rotation ?? 0, spriteName };
      if (!importedDecoSprites[spriteName]) importedDecoSprites[spriteName] = [];
      importedDecoSprites[spriteName].push({ r: d.y, c: d.x, rot: d.rotation ?? 0 });
    }
  }

  render();
  refreshPalette();
  showImportNotice(data);
}

function showImportNotice(data) {
  const notice = document.getElementById('import-notice');
  const body   = document.getElementById('import-notice-body');

  const tileNames = Object.entries(importedTileManifest)
    .sort((a, b) => parseInt(a[0]) - parseInt(b[0]))
    .map(([idx, name]) => `  [${idx}] ${name}`);

  const decoNames = Object.keys(importedDecoSprites);

  let html = `<strong>✅ Map "${data.id}" importée</strong> — ${COLS}×${ROWS}`;

  if (tileNames.length) {
    html += `<br><br><strong>🧱 Rechargez les tuiles dans cet ordre :</strong><br>`;
    html += `<span class="tile-list">${tileNames.join('<br>')}</span>`;
  }
  if (decoNames.length) {
    html += `<br><br><strong>🌲 Rechargez les sprites de décoration :</strong><br>`;
    html += `<span class="tile-list">${decoNames.map(n => `  ${n}`).join('<br>')}</span>`;
  }
  if (!tileNames.length && !decoNames.length) {
    html += `<br><span style="color:#4ade80">Aucune image à recharger.</span>`;
  }

  body.innerHTML = html;
  notice.style.display = 'block';
}

// ── Quand on charge des tuiles après un import : auto-match par nom ──
function tryMatchTilesAfterLoad() {
  if (!Object.keys(importedTileManifest).length) return;
  const byName = {};
  tiles.forEach((t, i) => { byName[t.name] = i; });
  let matched = false;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const old = tileGrid[r][c];
      if (old < 0) continue;
      const expectedName = importedTileManifest[String(old)];
      if (expectedName && byName[expectedName] !== undefined) {
        tileGrid[r][c] = byName[expectedName];
        matched = true;
      }
    }
  }
  if (matched) render();
}

// ── Restaure les dalles couleur depuis un tileManifest importé ──
function restoreColorTilesFromManifest(manifest) {
  // Pour chaque entrée __color_#RRGGBB : trouve ou crée la dalle couleur
  const byName = {};
  tiles.forEach((t, i) => { byName[t.name] = i; });

  for (const [idx, name] of Object.entries(manifest)) {
    if (!name.startsWith('__color_')) continue;
    const color = name.replace('__color_', '');
    if (byName[name] === undefined) {
      // Crée la dalle couleur si elle n'existe pas encore
      const label = color;
      const t = makeColorTile(color, label);
      tiles.push(t);
      byName[name] = tiles.length - 1;
    }
    // Remplace les index dans la grille
    const targetIdx = byName[name];
    const srcIdx = parseInt(idx);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (tileGrid[r][c] === srcIdx) tileGrid[r][c] = targetIdx;
      }
    }
  }
}

// ── Quand on charge des décos après un import : auto-match par nom de sprite ──
function tryMatchDecosAfterLoad() {
  if (!Object.keys(importedDecoSprites).length) return;
  decos.forEach((deco, i) => {
    const spriteName = deco.name.replace(/\.[^.]+$/, '');
    const positions  = importedDecoSprites[spriteName];
    if (!positions) return;
    for (const { r, c, rot } of positions) {
      if (inBounds(c, r) && decoGrid[r][c]?.idx === -1 && decoGrid[r][c]?.spriteName === spriteName) {
        decoGrid[r][c] = { idx: i, rot };
      }
    }
    delete importedDecoSprites[spriteName];
  });
  render();
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
initColorTiles();
initBuiltinDecos();
initGrids();
resizeCanvas();
render();
refreshPalette();
</script>
