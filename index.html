<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Oris</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body {
        width: 100%; height: 100vh; height: 100dvh;
        overflow: hidden; background: #0b0d12; color: #e6e8ee;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
        position: fixed;
        left: 0; top: 0;
      }
      canvas { touch-action: none; -webkit-user-select: none; user-select: none; display: block; }
      #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
      #game { position: absolute; inset: 0; }

      /* ── HUD ── */
      #hud {
        position: absolute; left: 50%; bottom: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex; gap: 12px; align-items: center;
        background: rgba(14,18,26,.92); border: 1px solid #2a3142; border-radius: 12px;
        padding: 10px 14px; backdrop-filter: blur(6px); z-index: 10;
        box-shadow: 0 10px 30px rgba(0,0,0,.5);
        max-width: calc(100vw - 20px);
      }
      .stats { display: flex; gap: 10px; align-items: center; padding-right: 10px; border-right: 1px solid #2a3142; }
      .stat { display: flex; flex-direction: column; align-items: center; min-width: 52px; }
      .stat .label { font-size: 11px; letter-spacing: 1px; color: #8b93a7; text-transform: uppercase; }
      .stat .value { font-size: 18px; font-weight: 700; }
      .stat.hp .value { color: #ef4444; }
      .stat.pa .value { color: #fde047; }
      .stat.pm .value { color: #22c55e; }
      .stat.fl .value { color: #a855f7; }
      .spell .fcost { position: absolute; bottom: 2px; right: 4px; font-size: 10px; color: #a855f7; font-weight: 700; }
      .spells {
        display: flex; gap: 8px;
        overflow-x: auto; max-width: calc(100vw - 320px);
        -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
        padding-bottom: 2px;
      }
      .spells::-webkit-scrollbar { height: 3px; }
      .spells::-webkit-scrollbar-track { background: transparent; }
      .spells::-webkit-scrollbar-thumb { background: #2a3142; border-radius: 2px; }
      .spell {
        position: relative; scroll-snap-align: start; flex-shrink: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 64px; height: 64px; border-radius: 10px;
        background: linear-gradient(180deg, #1c2230, #131826);
        border: 1px solid #2a3142; cursor: pointer; user-select: none;
        transition: transform .08s ease, border-color .15s ease, box-shadow .15s ease;
      }
      @media (hover: hover) {
        .spell:hover { border-color: #4a5775; transform: translateY(-2px); }
      }
      .spell.active { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56,189,248,.25), 0 0 20px rgba(56,189,248,.35); }
      .spell.disabled { opacity: .45; cursor: not-allowed; }
      .spell.cooldown { opacity: .45; cursor: not-allowed; filter: grayscale(60%); }
      .spell .cd-label {
        position: absolute; top: 2px; left: 4px;
        font-size: 12px; color: #ef4444; font-weight: 900;
        text-shadow: 0 0 4px #000;
      }
      .spell .icon { font-size: 24px; }
      .spell .cost { position: absolute; top: 2px; right: 4px; font-size: 11px; color: #38bdf8; font-weight: 700; }
      .spell .name { font-size: 10px; color: #c2c8d5; margin-top: 2px; letter-spacing: .3px; }

      /* ── Turn button ── */
      .turn-btn {
        margin-left: 8px; padding: 10px 14px; border-radius: 10px; cursor: pointer;
        background: linear-gradient(180deg, #ef4444, #b91c1c); color: white; border: 0;
        font-weight: 700; letter-spacing: .5px; font-size: 13px; white-space: nowrap;
        min-height: 44px;
      }
      .flee-btn {
        background: linear-gradient(180deg, #78716c, #44403c);
      }
      .flee-btn:disabled { opacity: .35; cursor: not-allowed; }
      @media (hover: hover) { .turn-btn:hover:not(:disabled) { filter: brightness(1.15); } }

      /* ── Turn info ── */
      #turnInfo {
        position: absolute; top: 16px; top: max(16px, env(safe-area-inset-top));
        left: 50%; transform: translateX(-50%);
        background: rgba(14,18,26,.92); border: 1px solid #2a3142; border-radius: 999px;
        padding: 8px 18px; font-size: 13px; font-weight: 600; letter-spacing: .5px;
        z-index: 10; white-space: nowrap;
      }

      /* ── Log ── */
      #log {
        position: absolute; top: 16px; right: 16px; width: 260px; max-height: 200px;
        overflow-y: auto; background: rgba(14,18,26,.85); border: 1px solid #2a3142;
        border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5;
        z-index: 10; -webkit-overflow-scrolling: touch;
      }
      #log .entry { color: #c2c8d5; margin-bottom: 3px; }
      #log .entry.dmg { color: #fca5a5; }
      #log .entry.sys { color: #38bdf8; }

      /* ── Unit panels ── */
      .unit-panel {
        position: absolute; bottom: 90px;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        background: rgba(14,18,26,.88); border: 1px solid #2a3142; border-radius: 12px;
        padding: 8px; z-index: 10; backdrop-filter: blur(6px);
      }
      .unit-panel.left { left: 12px; }
      .unit-panel.right { right: 12px; }
      .portrait {
        width: 72px; height: 72px; border-radius: 8px;
        object-fit: cover; border: 2px solid #2a3142; display: block;
      }
      .portrait.hero { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56,189,248,.35); }
      .portrait.enemy { border-color: #ef4444; box-shadow: 0 0 12px rgba(239,68,68,.35); }
      .unit-name { font-size: 11px; letter-spacing: .5px; font-weight: 600; text-align: center; }
      .hero-name { color: #38bdf8; }
      .enemy-name { color: #ef4444; }

      /* ════════════════════════════════════════════
         MOBILE — ≤ 600px wide
      ════════════════════════════════════════════ */
      @media (max-width: 600px) {
        #hud {
          flex-wrap: wrap;
          gap: 6px;
          padding: 8px 10px;
          padding-bottom: max(8px, env(safe-area-inset-bottom));
          width: calc(100vw - 16px);
          justify-content: center;
          border-radius: 10px;
          bottom: max(8px, env(safe-area-inset-bottom));
        }
        .stats {
          gap: 4px;
          padding-right: 6px;
          order: 1;
          flex: 1;
          min-width: 0;
        }
        .stat { min-width: 40px; }
        .stat .label { font-size: 9px; letter-spacing: 0; }
        .stat .value { font-size: 15px; }

        .turn-btn {
          order: 2;
          margin-left: 0;
          padding: 8px 10px;
          font-size: 11px;
          border-radius: 8px;
          align-self: stretch;
        }
        .spells {
          order: 3;
          width: 100%;
          justify-content: center;
          gap: 6px;
        }
        .spell {
          width: 58px; height: 58px; border-radius: 9px;
        }
        .spell .icon { font-size: 22px; }
        .spell .name { font-size: 9px; }
        .spell .cost { font-size: 10px; }
        .spell .fcost { font-size: 9px; }

        /* Log hidden on mobile — too cluttered */
        #log { display: none; }

        #turnInfo {
          font-size: 11px;
          padding: 5px 12px;
          top: max(8px, env(safe-area-inset-top));
        }

        /* Portrait panels: smaller and lifted above 2-row HUD */
        .unit-panel { bottom: 150px; padding: 5px; gap: 4px; }
        .portrait { width: 52px; height: 52px; border-radius: 6px; }
        .unit-name { font-size: 10px; }
      }

      /* Very narrow phones */
      @media (max-width: 380px) {
        .stat .label { display: none; }
        .spell { width: 52px; height: 52px; }
        .spell .name { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="turnInfo">Tour 1 — Archer</div>
      <div id="log"></div>
      <!-- Side portrait panels -->
      <div class="unit-panel left" id="panel-hero" style="display:none">
        <img id="portrait-hero" class="portrait hero" src="" alt="Archer" />
        <div class="unit-name hero-name">Archer</div>
      </div>
      <div class="unit-panel right" id="panel-enemy" style="display:none">
        <img id="portrait-enemy" class="portrait enemy" src="" alt="Ennemi" />
        <div class="unit-name enemy-name">Ennemi</div>
      </div>

      <div id="hud">
        <div class="stats">
          <div class="stat hp"><span class="label">PV</span><span class="value" id="hp">50</span></div>
          <div class="stat pa"><span class="label">PA</span><span class="value" id="pa">6</span></div>
          <div class="stat pm"><span class="label">PM</span><span class="value" id="pm">3</span></div>
          <div class="stat fl"><span class="label">Fluide</span><span class="value" id="fl">10/10</span></div>
        </div>
        <div class="spells" id="spells"></div>
        <button class="turn-btn flee-btn" id="fleeBtn">FUIR ↩</button>
        <button class="turn-btn" id="endTurn">FIN DE TOUR</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
